[project]
name = "delegate"
version = "0.1.0"
description = "Delegate: an agent negotiates for you inside a mandate the server enforces, and proves what it did."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Satyam Dwivedi" }]
requires-python = ">=3.12,<3.13"
dependencies = [
  "mandate-gate",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "pgserver>=0.1.4",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "mypy>=1.11",
  "ruff>=0.6",
  "hypothesis>=6.100",
]

[tool.uv.sources]
mandate-gate = { workspace = true }

[tool.uv.workspace]
members = ["packages/mandate_gate"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services/api/delegate"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/mandate_gate/tests", "evaluation/tests"]
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["delegate", "mandate_gate"]
mypy_path = ["services/api", "packages/mandate_gate/src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pgserver.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["delegate", "mandate_gate", "tests"]
